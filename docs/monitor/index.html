<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor Chile · La economía chilena en datos</title>
<meta name="description" content="Indicadores de la economía chilena (actividad, precios, dólar, tasas, empleo y comercio exterior) con los últimos datos, el calendario de publicaciones y comentarios automáticos.">
<meta name="theme-color" content="#0b0d12">
<script>
  // Tema antes de pintar, para evitar el parpadeo: preferencia guardada o la del sistema.
  try {
    var guardado = localStorage.getItem("monitor-tema");
    var tema = guardado || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", tema);
  } catch (e) {}
</script>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
</head>

<div id="app" aria-live="polite"><p class="cargando">Cargando datos…</p></div>
<script type="module" src="app.js"></script>
</body>
</html>
